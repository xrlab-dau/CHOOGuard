    detail.append(el('h3','근거 읽기'));const sources=el('ul');n.sources.forEach(s=>{const item=el('li'),link=el('a',s.label);link.href=s.repoPath?'../../'+s.repoPath:s.url;if(!s.repoPath){link.target='_blank';link.rel='noopener noreferrer';}item.append(link);if(s.repoPath)item.append(el('div',s.repoPath,'path'));if(s.anchor)item.append(el('div',s.anchor,'quiet'));sources.append(item);});detail.append(sources);
    detail.append(el('h3','해석의 범위'));const limits=el('ul');n.limits.forEach(t=>limits.append(el('li',t)));detail.append(limits);
    detail.append(el('h3','연결'));const relations=el('ul');graph.edges.filter(e=>e.from===n.id||e.to===n.id).forEach(e=>{const item=el('li'),other=e.from===n.id?e.to:e.from;item.append(el('span',(e.from===n.id?'→ ':'← ')+e.relation+' '));const button=el('button',byId.get(other).title);button.addEventListener('click',()=>{if(byId.get(other).status==='superseded')history.checked=true;topic.value='all';query.value='';pick(other);});item.append(button);relations.append(item);});detail.append(relations);
  }
  document.getElementById('stamp').textContent=`offline snapshot · ${payload.generatedAt} · schema valid ≠ runtime acceptance`;
  [query,topic,history].forEach(e=>e.addEventListener('input',()=>{draw();show();}));machine.addEventListener('change',show);
  document.getElementById('reset').addEventListener('click',()=>{query.value='';topic.value='all';history.checked=false;pick('goal.foundation');});
  if(!byId.has(selected))selected=graph.nodes[0].id;draw();show();
})();
</script>
