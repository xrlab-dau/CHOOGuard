<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부산역 본관 2층 · 실제 씬 수정 비교</title><style>*{box-sizing:border-box}body{margin:0;background:#10151a;color:#eaf0f4;font:16px/1.6 system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:32px 24px}h1{font-size:27px;line-height:1.3}p{color:#bfcbd3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.card{background:#1c242c;padding:18px;border-radius:12px}img{display:block;width:100%;height:auto}.compare{position:relative;overflow:hidden}.compare img:first-child{position:relative}.compare img:last-child{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}input{width:100%;accent-color:#6fd5a2}label{display:block;margin:12px 0}.labels{display:flex;justify-content:space-between;color:#bfd0da}a{color:#91c8ff}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:18px}h1{font-size:23px}}</style><main><h1>본관 2층 · 도면에 따른 실제 씬 수정</h1><p>누락 벽 6개 추가 · 잘못된 기존 조각 64개 제거 · 같은 위치와 투영으로 촬영한 Unity 씬</p><div class="grid"><section class="card"><div class="labels"><span>수정 전</span><span>수정 후</span></div><div class="compare"><img src="main2f-before.png" alt="수정 전 Unity 씬"><img id="after" src="main2f-after.png" alt="수정 후 Unity 씬"></div><label for="split">비교 경계 이동</label><input id="split" type="range" min="0" max="100" value="50" aria-label="수정 전후 비교 경계"></section><section class="card"><h2>공식 도면의 수정 근거</h2><img src="official-plan-reviewed-lines.png" alt="녹색은 추가 벽, 빨간색은 제거한 잘못된 구획"><p>녹색: 추가한 벽 구간. 빨간색: 열린 방을 막던 기존 구획.</p><p>실제 플레이어가 두 구간을 양방향으로 총 4회 통과했습니다. 매 이동마다 발밑 9점과 충돌 상태를 검사했습니다.</p><p>검증 범위: 표시한 2층 수정 구간. 부산역 전체 내부 유사도는 미검증입니다.</p><a href="artifact-provenance.json">원본 파일과 씬 해시</a></section></div></main><script>document.getElementById('split').addEventListener('input',e=>document.getElementById('after').style.clipPath='inset(0 0 0 '+e.target.value+'%)')</script></html>
