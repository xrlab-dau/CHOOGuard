version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7 # new releases wait a week: compromised versions are usually pulled within days
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # Hash-locked CI requirements (uv pip compile). Only tools.in: physics.in is a --no-deps set that pins deprecated 1.3.1 and
  # wrapt 2.4.1 beyond jupedsim 1.4.2's declared deprecated~=1.2.18 (its GUI stack is left out on purpose). Dependabot resolves
  # the full graph, so every physics update failed with "conflicting dependencies" (run 37246683344). Physics pins move by hand
  # with workers/physics/requirements-core.txt and the probe receipt.
  - package-ecosystem: pip
    directory: /.github/requirements
    exclude-paths:
      - "physics.in"
      - "physics.txt"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7 # new releases wait a week: compromised versions are usually pulled within days
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      python:
        patterns: ["*"]
