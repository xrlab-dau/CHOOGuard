name: Unity Windows Build

on:
  push:
    branches: [develop]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disabled-notice:
    if: ${{ vars.UNITY_CI_ENABLED != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Unity build is staged but disabled. See docs/ci.md.'

  build:
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Unity project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json', 'Assets/**') }}
          restore-keys: Library-${{ runner.os }}-StandaloneWindows64-

      - name: Build Windows OpenXR player
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64
          buildsPath: build
          allowDirtyBuild: false

      - name: Upload development build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choo-guard-windows-${{ github.sha }}
          path: build/StandaloneWindows64
          retention-days: 14
