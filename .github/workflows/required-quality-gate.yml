name: Required Quality Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy, security and repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate PR metadata
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          status=0
          python scripts/ci/pr_policy.py \
            --event "$GITHUB_EVENT_PATH" \
            --report pr-policy-report.md || status=$?
          if [ -f pr-policy-report.md ]; then
            # Guard unconditionally: a cat failure here (unreadable report,
            # unwritable/unset $GITHUB_STEP_SUMMARY) must NEVER change
            # `status`, which already holds the script's real exit code.
            # `if ! cmd; then ...; fi` never triggers `set -e`, unlike a bare
            # `cmd || true` masking the failure with zero signal: report it
            # as a stdout ::warning:: so a human still learns the summary is
            # incomplete, without touching the step's real exit status.
            if ! cat pr-policy-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
              echo "::warning::failed to append pr-policy-report.md to the step summary; the report artifact is still uploaded separately. This step's real exit code ($status) is unaffected."
            fi
          else
            # Written to actual stdout (not redirected into the step-summary
            # file) so GitHub Actions interprets it as a real Checks-tab
            # annotation -- workflow commands are only recognised on a
            # step's stdout stream, never inside a file the step happens to
            # write to. A best-effort copy also goes into the step summary
            # for a human reading the Job Summary page, guarded the same way
            # as above so a summary-write failure here cannot mask `status`.
            message="pr-policy-report.md was not written (script exit $status); this step's exit code reflects the script's own status, not a missing-file error."
            echo "::error::$message"
            echo "::error::$message" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "::warning::additionally failed to append the above error to the step summary"
          fi
          exit "$status"

      - name: Validate repository and changed files
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            python scripts/ci/repository_policy.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --report repository-policy-report.md || status=$?
          else
            python scripts/ci/repository_policy.py \
              --report repository-policy-report.md || status=$?
          fi
          if [ -f repository-policy-report.md ]; then
            # See the identical guard in "Validate PR metadata" above for the
            # rationale: never let a cat failure change `status`, but still
            # surface it as a stdout ::warning:: rather than swallowing it.
            if ! cat repository-policy-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
              echo "::warning::failed to append repository-policy-report.md to the step summary; the report artifact is still uploaded separately. This step's real exit code ($status) is unaffected."
            fi
          else
            # Sent to real stdout so it becomes a genuine Checks annotation;
            # see the matching comment in "Validate PR metadata" above.
            message="repository-policy-report.md was not written (script exit $status); this step's exit code reflects the script's own status, not a missing-file error."
            echo "::error::$message"
            echo "::error::$message" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "::warning::additionally failed to append the above error to the step summary"
          fi
          exit "$status"

      - name: Test policy code
        if: always()
        run: python -m unittest discover -s scripts/ci/tests -v

      - name: Test synthetic Foundation contracts
        if: always()
        run: python scripts/dev/check_foundation.py > foundation-data-report.json

      - name: Validate per-object reference bindings
        if: always()
        run: |
          python -m unittest discover -s scripts/art -p 'test_*.py' -v
          python scripts/art/validate_reference_assets.py --require-reviewed

      - name: Validate portable project context
        if: always()
        run: |
          python -m unittest discover -s scripts/context -p 'test_*.py' -v
          python scripts/context/context_graph.py validate

      - name: Validate YAML syntax
        if: always()
        run: |
          ruby -e 'require "yaml"; Dir.glob("**/*.{yml,yaml}", File::FNM_DOTMATCH).each { |f| YAML.safe_load(File.read(f), aliases: true); puts "ok #{f}" }'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-quality-gate-reports
          path: |
            *-policy-report.md
            foundation-data-report.json
          if-no-files-found: warn
          retention-days: 14
