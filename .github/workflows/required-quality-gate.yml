name: Required Quality Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap boundaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test bootstrap and native platform boundaries
        shell: bash
        run: |
          status=0
          python -m unittest discover -s scripts/bootstrap -p 'test_*.py' -v > bootstrap-tests.log 2>&1 || status=$?
          cat bootstrap-tests.log
          exit "$status"

      - name: Test Windows performance evidence validator
        if: always()
        shell: bash
        run: |
          status=0
          python -m unittest discover -s school/windows-validation -p 'test_*.py' -v > profile-tests.log 2>&1 || status=$?
          cat profile-tests.log
          exit "$status"

      - name: Record tested commit
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > tested-commit.txt
          python --version >> tested-commit.txt

      - name: Upload boundary test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootstrap-${{ matrix.os }}-${{ github.run_id }}
          path: |
            bootstrap-tests.log
            profile-tests.log
            tested-commit.txt
          if-no-files-found: error
          retention-days: 14

  policy:
    name: Policy, security and repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate PR metadata
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          status=0
          python scripts/ci/pr_policy.py \
            --event "$GITHUB_EVENT_PATH" \
            --report pr-policy-report.md || status=$?
          cat pr-policy-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Validate repository and changed files
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            python scripts/ci/repository_policy.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --report repository-policy-report.md || status=$?
          else
            python scripts/ci/repository_policy.py \
              --report repository-policy-report.md || status=$?
          fi
          cat repository-policy-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Test policy code
        if: always()
        run: python -m unittest discover -s scripts/ci/tests -v

      - name: Test synthetic Foundation contracts
        if: always()
        run: python scripts/dev/check_foundation.py > foundation-data-report.json

      - name: Validate per-object reference bindings
        if: always()
        run: |
          python -m unittest discover -s scripts/art -p 'test_*.py' -v
          python scripts/art/validate_reference_assets.py --require-reviewed

      - name: Validate portable project context
        if: always()
        run: |
          python -m unittest discover -s scripts/context -p 'test_*.py' -v
          python scripts/context/context_graph.py validate

      - name: Validate YAML syntax
        if: always()
        run: |
          ruby -e 'require "yaml"; Dir.glob("**/*.{yml,yaml}", File::FNM_DOTMATCH).each { |f| YAML.safe_load(File.read(f), aliases: true); puts "ok #{f}" }'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-quality-gate-reports
          path: |
            *-policy-report.md
            foundation-data-report.json
          if-no-files-found: warn
          retention-days: 14
