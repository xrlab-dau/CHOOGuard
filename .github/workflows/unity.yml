name: Unity

# Licensed Unity lanes on GitHub-hosted Windows, macOS and Linux runners: the game must run on every desktop OS and the
# team develops on Windows and macOS. One Student-plan seat allows two concurrent activations and the maintainer's Mac
# holds one, so every licensed job shares one repository-wide queue and is never cancelled mid-run (a killed editor
# cannot return its activation). Built players need no licence, so their smoke runs go in parallel.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*"]
  schedule:
    - cron: "0 18 * * *" # 03:00 KST: nightly tests on every OS, the Bootstrap build and players of develop
  workflow_dispatch:
    inputs:
      os:
        description: Editor tests on which OS
        type: choice
        options: [all, windows, macos, linux]
        default: all
      build:
        description: Also build and smoke-run the players
        type: boolean
        default: true
      bootstrap:
        description: Also run CS-BOOT.01.01's real Bootstrap build on macOS and Windows (nightly does)
        type: boolean
        default: false

permissions: {}

jobs:
  gate:
    name: Unity lane gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
      build: ${{ steps.decide.outputs.build }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - id: decide
        name: Decide what runs
        env:
          ENABLED: ${{ vars.UNITY_CI_ENABLED }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          OS_INPUT: ${{ inputs.os }}
          BUILD_INPUT: ${{ inputs.build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Unity project plus the files its EditMode tests read from the repository root (fixtures, the assembly
          # contract, build receipts). Keep in sync with the project checkout in the tests job.
          unity_paths='^(Assets|Packages|ProjectSettings|content|docs/build|docs/CHOOGuard_Story_Plan_v4/basis/v3/contracts)/'
          all='["windows","macos","linux"]'
          # Pull requests cover the team's development OSes; Linux runs on develop, nightly and release tags.
          pr='["windows","macos"]'
          tests='[]' build=false reason=""
          if [[ $ENABLED != true ]]; then
            reason="repository variable UNITY_CI_ENABLED is not 'true'"
          elif [[ $HAS_SERIAL != true || $HAS_EMAIL != true || $HAS_PASSWORD != true ]]; then
            reason="licence secrets UNITY_SERIAL, UNITY_EMAIL and UNITY_PASSWORD are not all set"
          elif [[ $EVENT == pull_request && $PR_REPO != "$REPO" ]]; then
            reason="pull requests from forks receive no licence secrets"
          elif [[ $EVENT == pull_request ]]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
            # The files API stops at 3000 entries; a change that large is treated as touching Unity.
            if grep -qE "$unity_paths" <<<"$files" || (( $(wc -l <<<"$files") >= 3000 )); then
              tests=$pr
            else
              reason="the pull request does not touch the Unity project or its test inputs"
            fi
          elif [[ $EVENT == push && $REF == refs/tags/v* ]]; then
            tests=$all build=true
          elif [[ $EVENT == push ]]; then
            if [[ $BEFORE =~ ^0+$ ]]; then
              tests=$all build=true
            else
              files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename')
              if grep -qE "$unity_paths" <<<"$files" || (( $(wc -l <<<"$files") >= 300 )); then
                tests=$all build=true
              else
                reason="the push does not touch the Unity project or its test inputs"
              fi
            fi
          elif [[ $EVENT == workflow_dispatch ]]; then
            if [[ $OS_INPUT == all ]]; then tests=$all; else tests="[\"$OS_INPUT\"]"; fi
            build=$BUILD_INPUT
          else
            tests=$all build=true
          fi
          {
            echo "tests=$tests"
            echo "build=$build"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "tests=$tests build=$build ${reason:+(skip: $reason)}"

  tests:
    name: EditMode + PlayMode (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.tests != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.tests) }}
    runs-on: ${{ fromJSON('{"windows":"windows-2025","macos":"macos-26","linux":"ubuntu-24.04"}')[matrix.os] }}
    timeout-minutes: 240
    concurrency:
      group: unity-licence
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    env:
      # The project lives in its own directory so the local actions can come from a small .github-only checkout at the
      # workspace root (`uses:` cannot vary per OS). Windows uses a non-ASCII folder with a space: a teammate's Korean
      # user folder broke Mono path handling before.
      PROJECT: ${{ matrix.os == 'windows' && '경로 검사/CHOOGuard' || 'project' }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.os == 'windows' && '경로 검사/CHOOGuard' || 'project' }}
    steps:
      # First, so its clean step can never touch the project checkout below.
      - name: Check out the CI actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # Test inputs outside Assets come along (content/fixtures, the assembly contract, docs/build receipts);
      # the gate's unity_paths lists the same directories.
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.PROJECT }}
          sparse-checkout: |
            .github
            Assets
            Packages
            ProjectSettings
            content
            docs/build
            docs/CHOOGuard_Story_Plan_v4/basis/v3/contracts
          persist-credentials: false

      - id: unity
        uses: ./.github/actions/setup-unity
        with:
          project-path: ${{ env.PROJECT }}

      - name: Pinned SQLite for the persistence tests
        uses: ./.github/actions/pinned-sqlite

      - id: library
        name: Restore the Library import cache
        if: matrix.os != 'linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PROJECT }}/Library
          key: library-${{ matrix.os }}-${{ steps.unity.outputs.version }}-${{ hashFiles(format('{0}/Packages/packages-lock.json', env.PROJECT)) }}-${{ github.sha }}
          restore-keys: |
            library-${{ matrix.os }}-${{ steps.unity.outputs.version }}-${{ hashFiles(format('{0}/Packages/packages-lock.json', env.PROJECT)) }}-
            library-${{ matrix.os }}-${{ steps.unity.outputs.version }}-

      - id: activate
        name: Activate the licence
        timeout-minutes: 10
        env:
          UNITY_EDITOR: ${{ steps.unity.outputs.editor }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: .github/scripts/unity_ci.sh activate

      - id: editmode
        name: EditMode tests
        timeout-minutes: 100
        env:
          UNITY_EDITOR: ${{ steps.unity.outputs.editor }}
          UNITY_PROJECT: ${{ github.workspace }}/${{ env.PROJECT }}
        run: .github/scripts/unity_ci.sh test EditMode

      - id: playmode
        name: PlayMode tests
        if: always() && steps.activate.outcome == 'success'
        timeout-minutes: 60
        env:
          UNITY_EDITOR: ${{ steps.unity.outputs.editor }}
          UNITY_PROJECT: ${{ github.workspace }}/${{ env.PROJECT }}
        run: .github/scripts/unity_ci.sh test PlayMode

      # CS-BOOT.01.01's real build (BuildBaseline: validator, Development player of the Bootstrap scene, receipt with
      # output hashes) inside the same activation. BuildBaseline builds macOS and Windows targets, each on its own host.
      - name: Bootstrap build (BuildBaseline)
        if: steps.activate.outcome == 'success' && matrix.os != 'linux' && (github.event_name == 'schedule' || inputs.bootstrap)
        timeout-minutes: 60
        env:
          UNITY_EDITOR: ${{ steps.unity.outputs.editor }}
          UNITY_PROJECT: ${{ github.workspace }}/${{ env.PROJECT }}
        run: .github/scripts/unity_ci.sh bootstrap

      - name: Return the licence
        if: always() && steps.activate.outcome != 'skipped'
        timeout-minutes: 10
        env:
          UNITY_EDITOR: ${{ steps.unity.outputs.editor }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: .github/scripts/unity_ci.sh return

      - name: Verdict
        if: always() && steps.activate.outcome == 'success'
        env:
          EDIT_EXIT: ${{ steps.editmode.outputs.exit_code }}
          PLAY_EXIT: ${{ steps.playmode.outputs.exit_code }}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" .github/scripts/unity_results.py \
            "EditMode:$RUNNER_TEMP/unity/EditMode-results.xml:$EDIT_EXIT" \
            "PlayMode:$RUNNER_TEMP/unity/PlayMode-results.xml:$PLAY_EXIT"

      - name: Remove credentials from logs
        if: always()
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: .github/scripts/unity_ci.sh scrub

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-tests-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unity
          retention-days: 14
          if-no-files-found: ignore

      # Only develop saves: pull requests restore develop's import and can never overwrite it. Linux stays uncached to
      # keep the Windows and macOS imports inside the 10 GB cache budget.
      - name: Save the Library import cache
        if: >-
          always() && matrix.os != 'linux' && github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
          (steps.editmode.outputs.exit_code == '0' || steps.editmode.outputs.exit_code == '2')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PROJECT }}/Library
          key: library-${{ matrix.os }}-${{ steps.unity.outputs.version }}-${{ hashFiles(format('{0}/Packages/packages-lock.json', env.PROJECT)) }}-${{ github.sha }}

  build:
    name: Players (macOS, Windows, Linux)
    needs: [gate, tests]
    if: needs.gate.outputs.build == 'true' && needs.tests.result == 'success'
    runs-on: macos-26
    timeout-minutes: 330
    concurrency:
      group: unity-licence
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            Assets
            Packages
            ProjectSettings
          persist-credentials: false

      - id: unity
        uses: ./.github/actions/setup-unity
        with:
          modules: windows-mono linux-mono

      - id: activate
        name: Activate the licence
        timeout-minutes: 10
        env:
          UNITY_EDITOR: ${{ steps.unity.outputs.editor }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: .github/scripts/unity_ci.sh activate

      # Fresh import on purpose: release players never depend on a restored Library.
      - id: player
        name: Build (ChooGuard.Editor.PlayerBuild.BuildAll)
        timeout-minutes: 270
        env:
          UNITY_EDITOR: ${{ steps.unity.outputs.editor }}
        run: .github/scripts/unity_ci.sh build

      - name: Return the licence
        if: always() && steps.activate.outcome != 'skipped'
        timeout-minutes: 10
        env:
          UNITY_EDITOR: ${{ steps.unity.outputs.editor }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: .github/scripts/unity_ci.sh return

      - name: Package
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ $REF_TYPE == tag ]]; then label=$REF_NAME; else label=$(git rev-parse --short=12 HEAD); fi
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist/macos" "$dist/windows" "$dist/linux"
          # ditto keeps the app bundle's symlinks and every executable bit for the Linux player. The Windows and Linux
          # zips leave out macOS metadata: otherwise every file with an extended attribute (com.apple.provenance)
          # ships with an AppleDouble ._ twin.
          ditto -c -k --sequesterRsrc --keepParent Builds/macOS/CHOOGuard.app "$dist/macos/CHOOGuard-macOS-arm64-$label.zip"
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent Builds/Windows "$dist/windows/CHOOGuard-Windows-x64-$label.zip"
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent Builds/Linux "$dist/linux/CHOOGuard-Linux-x64-$label.zip"
          ls -l "$dist"/*/*.zip
          echo "dist=$dist" >> "$GITHUB_OUTPUT"

      - name: Upload the macOS player
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-macos
          path: ${{ steps.package.outputs.dist }}/macos
          retention-days: 30
          if-no-files-found: error

      - name: Upload the Windows player
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-windows
          path: ${{ steps.package.outputs.dist }}/windows
          retention-days: 30
          if-no-files-found: error

      - name: Upload the Linux player
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-linux
          path: ${{ steps.package.outputs.dist }}/linux
          retention-days: 30
          if-no-files-found: error

      - name: Remove credentials from logs
        if: always()
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: .github/scripts/unity_ci.sh scrub

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unity
          retention-days: 14
          if-no-files-found: ignore

  smoke:
    # Each OS starts its own player headless in the soak mode: station load, a fresh emergency session with its crowd,
    # play, return to title, JSON report. Players need no Unity licence, so these run in parallel. Linux runs inside
    # Xvfb: with no display the player's window backend stays null and it segfaults on the first frame (Unity bug,
    # reproduced with and without Xvfb on the same player in run 36420682952).
    name: Player smoke (${{ matrix.os }})
    needs: build
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, runner: windows-2025, player: CHOOGuard.exe }
          - { os: macos, runner: macos-26, player: CHOOGuard.app/Contents/MacOS/CHOOGuard }
          - { os: linux, runner: ubuntu-24.04, player: CHOOGuard.x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: player-${{ matrix.os }}
          path: ${{ runner.temp }}/player

      - name: Run the player (soak, 1 shift)
        id: run
        timeout-minutes: 30
        env:
          OS: ${{ matrix.os }}
          PLAYER: ${{ matrix.player }}
        run: |
          cd "$RUNNER_TEMP/player"
          zip=$(ls ./*.zip)
          case "$OS" in
            macos) ditto -x -k "$zip" . ;;
            linux) unzip -q "$zip" ;;
            windows) "$(command -v python3 || command -v python)" -m zipfile -e "$zip" . ;;
          esac
          player=$(find . -path "*/$PLAYER" -type f | head -1)
          [[ -n $player ]] || { echo "::error::player $PLAYER not found in $zip"; exit 1; }
          mkdir -p "$RUNNER_TEMP/smoke"
          runner=()
          if [[ $OS == linux ]]; then runner=(xvfb-run -a -s "-screen 0 1920x1080x24"); fi
          status=0
          ${runner[@]+"${runner[@]}"} "$player" -batchmode -nographics -soak -soak-shifts 1 -soak-minutes 0.5 \
            -soak-out "$RUNNER_TEMP/smoke/soak.json" -logFile "$RUNNER_TEMP/smoke/player.log" || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "player exited $status"

      - name: Verdict
        if: always()
        env:
          OS: ${{ matrix.os }}
          EXIT: ${{ steps.run.outputs.exit_code }}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" .github/scripts/soak_verdict.py "$RUNNER_TEMP/smoke/soak.json" 1 "$OS" "$EXIT"

      - name: Upload report and player log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-smoke-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Draft release
    needs: [build, smoke]
    if: github.ref_type == 'tag' && needs.build.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false

      - name: Releases come from main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag $GITHUB_REF_NAME is not on main; tag the merge commit of a develop -> main release PR"
            exit 1
          }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: player-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "CHOOGuard $TAG"

  result:
    # Becomes a required status check after the first green licensed run; passes as not-applicable when the lane is off
    # or the change does not touch Unity, and states why in the job summary.
    name: Unity tests
    needs: [gate, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Combine results
        env:
          GATE: ${{ needs.gate.result }}
          TESTS: ${{ needs.tests.result }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          if [[ $TESTS == success ]]; then
            echo "Unity tests passed on every requested OS"
          elif [[ $GATE == success && $TESTS == skipped ]]; then
            echo "::notice title=Unity tests not run::$REASON"
            echo "### Unity tests not run: $REASON" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Unity tests::gate=$GATE tests=$TESTS"
            exit 1
          fi
