name: Astra Develop Audit
on:
  push:
    branches: [chore/astra-develop-audit-20260915]
    paths:
      - scripts/review/inventory.py
      - scripts/review/tests/test_inventory.py
      - .github/workflows/astra-develop-audit.yml
permissions:
  contents: read
concurrency:
  group: astra-develop-audit-${{ github.ref }}
  cancel-in-progress: false
# The Copilot probe was stopped after the server returned Access denied by
# policy settings in run 34946265970. That denial is preserved, not bypassed or
# interpreted as worker execution. No further Copilot token requests occur here.
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test census against real temporary Git objects
        run: python -B -m unittest discover -s scripts/review/tests -v
      - name: Inventory the fixed develop baseline
        run: python -B scripts/review/inventory.py --ref 86bb82bf5655562e2577cf2b83553ff261d8d5a6 --output "$RUNNER_TEMP/astra-census"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-develop-census
          path: ${{ runner.temp }}/astra-census/
          retention-days: 7
          if-no-files-found: error
