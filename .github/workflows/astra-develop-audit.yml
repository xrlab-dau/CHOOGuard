name: Astra Develop Audit
on:
  push:
    branches: [chore/astra-develop-audit-20260915]
permissions:
  contents: read
concurrency:
  group: astra-develop-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test census against real temporary Git objects
        run: python -B -m unittest discover -s scripts/review/tests -v
      - name: Inventory the fixed develop baseline
        run: python -B scripts/review/inventory.py --ref 86bb82bf5655562e2577cf2b83553ff261d8d5a6 --output "$RUNNER_TEMP/astra-census"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-develop-census
          path: ${{ runner.temp }}/astra-census/
          retention-days: 7
          if-no-files-found: error
  worker-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Install checksum-pinned official CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/astra-cli" "$RUNNER_TEMP/astra-auth-public" "$RUNNER_TEMP/astra-auth-private"
          curl --fail --location --proto '=https' --proto-redir '=https' https://github.com/github/copilot-cli/releases/download/v1.0.83/copilot-linux-x64.tar.gz -o "$RUNNER_TEMP/astra-cli/cli.tar.gz"
          echo "ffbe1c429664b8a05efed67ecdb467123e40fcaa3c6c14ef9a98ba74da4687b7  $RUNNER_TEMP/astra-cli/cli.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/astra-cli/cli.tar.gz" -C "$RUNNER_TEMP/astra-cli"
          "$RUNNER_TEMP/astra-cli/copilot" --version > "$RUNNER_TEMP/astra-auth-public/cli-version.txt"
          "$RUNNER_TEMP/astra-cli/copilot" --help > "$RUNNER_TEMP/astra-auth-public/cli-help.txt"
      - name: Probe one isolated no-tools model request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          private=root/'astra-auth-private'; public=root/'astra-auth-public'
          env=dict(os.environ,HOME=str(private),COPILOT_HOME=str(private/'copilot'),XDG_CONFIG_HOME=str(private/'xdg'))
          cmd=[str(root/'astra-cli/copilot'),'-p','Return exactly AS_AUDIT_READY. Do not call any tools.', '--model','gpt-5.4-mini','--silent','--no-ask-user','--no-auto-update','--no-custom-instructions','--disable-builtin-mcps','--deny-tool','*','--no-remote']
          try:
              p=subprocess.run(cmd,cwd=private,env=env,capture_output=True,text=True,timeout=75)
              ok=p.returncode==0 and p.stdout.strip()=='AS_AUDIT_READY'
              lower=(p.stdout+'\n'+p.stderr).lower()
              reason='ready' if ok else ('organization_policy_or_entitlement' if any(x in lower for x in ('not enabled','not allowed','policy','copilot license','subscription')) else 'authentication_or_cli_failure')
              data={'state':'AUTHENTICATED' if ok else 'BLOCKED','reason':reason,'exitCode':p.returncode,'requestedModel':'gpt-5.4-mini','modelIdentityAttested':False,'requestsAttempted':1,'codeSent':False,'toolsAllowed':False,'stdoutSha256':hashlib.sha256(p.stdout.encode()).hexdigest(),'stderrSha256':hashlib.sha256(p.stderr.encode()).hexdigest()}
          except subprocess.TimeoutExpired:
              data={'state':'BLOCKED','reason':'timeout','requestsAttempted':1,'codeSent':False}
          (public/'probe.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data))
          raise SystemExit(0 if data['state']=='AUTHENTICATED' else 2)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-worker-auth
          path: ${{ runner.temp }}/astra-auth-public/
          retention-days: 7
          if-no-files-found: error
