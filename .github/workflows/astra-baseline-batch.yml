name: Astra Original Baseline Batch
on:
  push:
    branches: [chore/astra-develop-audit-20260915]
    paths:
      - scripts/review/baseline_batch.py
      - scripts/review/tests/test_baseline_batch.py
      - .github/workflows/astra-baseline-batch.yml
permissions:
  contents: read
jobs:
  original-suite:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {suite: context, os: ubuntu-24.04}
          - {suite: dev, os: ubuntu-24.04}
          - {suite: ci, os: ubuntu-24.04}
          - {suite: art, os: ubuntu-24.04}
          - {suite: livekit, os: macos-14}
          - {suite: csharp, os: ubuntu-24.04}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          lfs: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 86bb82bf5655562e2577cf2b83553ff261d8d5a6
          path: baseline
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run current verification-driver regressions
        run: python -B -m unittest discover -s driver/scripts/review/tests -v
      - name: Run unmodified original suite with platform-specific evidence
        env:
          SUITE: ${{ matrix.suite }}
        run: python -B driver/scripts/review/baseline_batch.py --root baseline --suite "$SUITE" --output "$RUNNER_TEMP/astra-baseline-result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-baseline-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/astra-baseline-result/receipt.json
            ${{ runner.temp }}/astra-baseline-result/test-log.txt
            ${{ runner.temp }}/astra-baseline-result/runner-error.txt
            ${{ runner.temp }}/astra-baseline-result/results/*.trx
            ${{ runner.temp }}/astra-baseline-result/packages.lock.json
          retention-days: 7
          if-no-files-found: error
