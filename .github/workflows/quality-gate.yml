name: Quality gate

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    # This exact name is the required status check of the "Protected branches · main + develop" ruleset.
    name: Policy, security and repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Full history without blobs: tree listings, diffs and graph freshness need commits, not 4 GB of assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /ProjectSettings/
            .gitignore
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Repository policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A pull request is checked as its merge commit against that commit's first parent (the current base).
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI_HEAD_REF: ${{ github.head_ref }}
        run: python3 .github/scripts/ci_policy.py

      - name: Policy and CI script tests
        run: python3 -m unittest discover -s .github/scripts/tests

      - name: Lint workflows (actionlint + shellcheck)
        env:
          VERSION: "1.7.12"
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # actionlint 1.7.12 (2026-03) predates two newer GitHub syntaxes used here: the concurrency `queue`
          # key (2026-05) and self-repository `uses: $/...` references (2026-07). Only those two are ignored.
          "$RUNNER_TEMP/actionlint" -color \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            -ignore 'specifying action "\$/[^"]+" in invalid format because ref is missing'

      - name: Audit workflows (zizmor)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          advanced-security: false
          annotations: true

      - name: Secret scan of the change (gitleaks)
        if: github.event_name != 'workflow_dispatch'
        env:
          VERSION: "8.30.1"
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          if [[ $EVENT == pull_request ]]; then
            range="HEAD^1..HEAD^2"                      # the pull request's own commits
          elif [[ $BEFORE =~ ^0+$ ]]; then
            range="-1 HEAD"                             # new branch: the pushed tip only
          else
            range="$BEFORE..HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$range" .
