name: Non-Unity core regression reproduction
on:
  push:
    branches: [bugfix/nonunity-training-core-20260915]
    paths: [.github/workflows/nonunity-regressions-bootstrap.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Prepare dependency-free reproductions against original runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('nonunity-probe'); p.mkdir()
          (p/'global.json').write_text('{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}')
          (p/'Probe.csproj').write_text('''<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework></PropertyGroup><ItemGroup><Compile Include="../Packages/com.xrlab.chooguard.foundation/Runtime/**/*.cs" /></ItemGroup></Project>''')
          (p/'Program.cs').write_text(r'''
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Text.Json;
          using ChooGuard.Foundation.Multiplayer;
          class Program {
            static ConnectedWorldDefinition D() {
              var d=JsonSerializer.Deserialize<ConnectedWorldDefinition>(File.ReadAllText("../foundation/world/connected-world-profile.json"),new JsonSerializerOptions{IncludeFields=true});d.Validate();return d;
            }
            static bool Fits(float r) => new ConnectedPortalDefinition{FromPoint=new Point3(),ToPoint=new Point3(10,0,0),ClearWidth=1,ClearHeight=3}.Contains(new Point3(5,0,0),r,out _);
            static int Main(){
              var results=new List<object>();int failures=0;
              void Check(string name,Func<bool> test){bool pass=false;string error=null;try{pass=test();}catch(Exception e){error=e.GetType().Name;}if(!pass)failures++;results.Add(new{name,pass,error});Console.WriteLine(name+": "+(pass?"PASS":"FAIL"));}
              Check("oversized-body-cannot-fit",()=>!Fits(1));
              Check("negative-radius-denied",()=>!Fits(-1));
              Check("infinite-radius-denied",()=>!Fits(float.PositiveInfinity));
              Check("exact-fit-preserved",()=>Fits(.5f));
              Check("point-probe-preserved",()=>Fits(0));
              Check("region-nan-radius-denied",()=>{var d=D();var r=d.Region(d.StartRegionId);return !d.TryLocate(d.Pose(r.Id,r.Hub),r.Hub,float.NaN,null,out _);});
              Check("null-pose-rejected",()=>{var d=D();return !d.TryLocate(null,d.Region(d.StartRegionId).Hub,.25f,null,out _);});
              Check("input-geometry-owned",()=>{var d=D();var w=new SimulatedSpatialWorld(d);var old=d.Regions[0].Hub.X;d.Regions[0].Hub=new Point3(999,0,0);return w.At(d.Frames).Regions[0].Hub.X==old;});
              Check("output-portals-detached",()=>{var d=D();var w=new SimulatedSpatialWorld(d);var old=d.Portals[0].ClearWidth;w.At(d.Frames).Portals[0].ClearWidth=999;return w.At(d.Frames).Portals[0].ClearWidth==old;});
              Check("null-exclusion-rejected",()=>{var d=D();d.Regions[0].Exclusions=new RegionExclusion[]{null};try{d.Validate();return false;}catch(InvalidDataException){return true;}});
              Check("null-frame-rejected",()=>{var d=D();d.Frames[0]=null;try{d.Validate();return false;}catch(InvalidDataException){return true;}});
              File.WriteAllText("../nonunity-red.json",JsonSerializer.Serialize(new{source="86bb82bf5655562e2577cf2b83553ff261d8d5a6",failures,results},new JsonSerializerOptions{WriteIndented=true}));return failures==0?0:1;
            }
          }
          ''')
      - name: Compile and execute original product logic without Unity
        working-directory: nonunity-probe
        run: dotnet run --project Probe.csproj
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nonunity-red
          path: nonunity-red.json
          retention-days: 7
          if-no-files-found: error
