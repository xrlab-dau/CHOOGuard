name: Non-Unity core regression reproduction
on:
  push:
    branches: [bugfix/nonunity-training-core-20260915]
    paths: [.github/workflows/nonunity-regressions-bootstrap.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Materialize hash-bound regression tests only
        shell: python
        run: |
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded))
          if hashlib.sha256(patch).hexdigest() != 'eaa9ac1aacd3beae6855e7cd9b7c072bd5e5372f68b96942f367e2b93ab43aab':
              raise SystemExit('Regression input digest mismatch')
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
      - name: Compile original core and reproduce failing regressions
        working-directory: tests/nonunity
        run: |
          dotnet --version
          dotnet restore --locked-mode
          dotnet test --no-restore --logger "trx;LogFileName=nonunity-red.trx" --results-directory ../../nonunity-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nonunity-red
          path: nonunity-results/*.trx
          retention-days: 7
          if-no-files-found: error
