name: Foundation Integration

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-contracts:
    name: Reproducible source and contract validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: false
      - name: Record reproducible tracked-source snapshot
        run: |
          mkdir -p integration-evidence
          git rev-parse HEAD > integration-evidence/source-sha.txt
          git archive --format=tar.gz --output=integration-evidence/tracked-source.tar.gz HEAD
          sha256sum integration-evidence/tracked-source.tar.gz > integration-evidence/archive-sha256.txt
          printf '%s\n' 'Source archive contains tracked Git bytes, including LFS pointers, not materialized LFS assets.' > integration-evidence/scope.txt
      - name: Validate phase graph
        run: node scripts/context/work_graph.mjs validate
      - name: Test phase graph
        if: ${{ !cancelled() }}
        run: node --test scripts/context/work_graph.test.mjs
      - name: Validate portable context
        if: ${{ !cancelled() }}
        run: python3 scripts/context/context_graph.py validate
      - name: Validate Foundation data
        if: ${{ !cancelled() }}
        run: python3 scripts/dev/check_foundation.py > integration-evidence/foundation-data.json
      - name: Upload exact tracked source for reproducible diagnosis
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-integration-source-${{ github.run_id }}
          path: integration-evidence/
          if-no-files-found: error
          retention-days: 3

  headless-core:
    name: Actual C# core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          lfs: false
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'
      - name: Restore exact locked dependencies
        run: dotnet restore tests/headless/ChooGuard.Foundation.Headless.csproj --locked-mode
      - name: Compile and run canonical core fixtures
        run: |
          mkdir -p integration-evidence
          git rev-parse HEAD > integration-evidence/source-sha.txt
          dotnet --info > integration-evidence/dotnet-info.txt
          dotnet run --no-restore --project tests/headless/ChooGuard.Foundation.Headless.csproj -c Release -- --result=integration-evidence/headless-results.xml --workers=0
      - name: Verify source and dependency lock were not rewritten
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Upload actual regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-headless-${{ matrix.os }}-${{ github.run_id }}
          path: integration-evidence/
          if-no-files-found: error
          retention-days: 7

  unity-capability:
    name: Verify Unity execution prerequisites
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check existing Unity CI credentials without disclosure
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_CI_ENABLED: ${{ vars.UNITY_CI_ENABLED }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          licensed = bool(os.environ.get('UNITY_LICENSE'))
          account = bool(os.environ.get('UNITY_EMAIL')) and bool(os.environ.get('UNITY_PASSWORD'))
          enabled = os.environ.get('UNITY_CI_ENABLED') == 'true'
          result = {'schemaVersion': 1, 'unityCiEnabled': enabled,
                    'licenseConfigured': licensed, 'accountConfigured': account,
                    'status': 'CONFIGURED_NOT_EXECUTED' if licensed or account else 'BLOCKED_MISSING_UNITY_LICENSE',
                    'unityTestsExecuted': False}
          Path('unity-capability.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result))
          if result['status'].startswith('BLOCKED'):
              print('::warning::Unity execution is unavailable: no existing CI license/account. Core test success is not Unity acceptance.')
          PY
      - name: Upload capability result only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-unity-capability-${{ github.run_id }}
          path: unity-capability.json
          if-no-files-found: error
          retention-days: 3

  project-context-probe:
    name: Read public project context when authorized
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/astra-foundation-integration-20260915' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query referenced Projects with existing read-only token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          results = []
          def query(text, variables):
              request = urllib.request.Request('https://api.github.com/graphql',
                  data=json.dumps({'query': text, 'variables': variables}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return json.load(response)
              except (urllib.error.URLError, TimeoutError):
                  return {'errors': [{'type': 'TRANSPORT_FAILURE'}]}
          for number in [1, 2]:
              response = query('query($n:Int!){organization(login:"xrlab-dau"){projectV2(number:$n){number title url public closed}}}', {'n': number})
              project = ((response.get('data') or {}).get('organization') or {}).get('projectV2')
              if response.get('errors') or not project:
                  results.append({'number': number, 'status': 'UNAVAILABLE_WITH_EXISTING_TOKEN',
                      'errorTypes': sorted({e.get('type', 'UNSPECIFIED') for e in response.get('errors', [])})})
                  continue
              if not project['public']:
                  results.append({'number': number, 'status': 'PRIVATE_BOARD_NOT_EXPORTED'})
                  continue
              project['items'] = []; project['status'] = 'PUBLIC_ITEMS_OBSERVED'; cursor = None
              for page in range(20):
                  response = query('query($n:Int!,$after:String){organization(login:"xrlab-dau"){projectV2(number:$n){items(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{content{...on Issue{number title state url repository{nameWithOwner isPrivate}} ...on PullRequest{number title state url repository{nameWithOwner isPrivate}}} fieldValues(first:50){pageInfo{hasNextPage} nodes{...on ProjectV2ItemFieldSingleSelectValue{name field{...on ProjectV2FieldCommon{name}}}}}}}}}}', {'n': number, 'after': cursor})
                  block = ((((response.get('data') or {}).get('organization') or {}).get('projectV2') or {}).get('items'))
                  if response.get('errors') or not block:
                      project['status'] = 'PARTIAL_PUBLIC_ITEMS'; break
                  for node in block['nodes']:
                      content = node.get('content') or {}; repo = content.get('repository') or {}
                      if repo.get('nameWithOwner') == 'xrlab-dau/CHOOGuard' and repo.get('isPrivate') is False:
                          project['items'].append(node)
                  if not block['pageInfo']['hasNextPage']: break
                  cursor = block['pageInfo']['endCursor']
              else:
                  project['status'] = 'PARTIAL_PUBLIC_ITEMS_PAGE_BUDGET'
              results.append(project)
          result = {'schemaVersion': 1, 'scope': 'read-only public board metadata and CHOOGuard issue/PR single-select fields; no draft/private content', 'projects': results, 'writesPerformed': False}
          Path('project-context-probe.json').write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n')
          print(json.dumps([{'number': p['number'], 'status': p['status']} for p in results]))
          PY
      - name: Upload public context or explicit access gap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-project-context-${{ github.run_id }}
          path: project-context-probe.json
          if-no-files-found: error
          retention-days: 3
