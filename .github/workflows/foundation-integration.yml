name: Foundation Integration

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-contracts:
    name: Reproducible source and contract validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: false
      - name: Record reproducible tracked-source snapshot
        run: |
          mkdir -p integration-evidence
          git rev-parse HEAD > integration-evidence/source-sha.txt
          git archive --format=tar.gz --output=integration-evidence/tracked-source.tar.gz HEAD
          sha256sum integration-evidence/tracked-source.tar.gz > integration-evidence/archive-sha256.txt
          printf '%s\n' 'Source archive contains tracked Git bytes, including LFS pointers, not materialized LFS assets.' > integration-evidence/scope.txt
      - name: Validate phase graph
        run: node scripts/context/work_graph.mjs validate
      - name: Test phase graph
        if: ${{ !cancelled() }}
        run: node --test scripts/context/work_graph.test.mjs
      - name: Validate portable context
        if: ${{ !cancelled() }}
        run: python3 scripts/context/context_graph.py validate
      - name: Validate Foundation data
        if: ${{ !cancelled() }}
        run: python3 scripts/dev/check_foundation.py > integration-evidence/foundation-data.json
      - name: Upload exact tracked source for reproducible diagnosis
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-integration-source-${{ github.run_id }}
          path: integration-evidence/
          if-no-files-found: error
          retention-days: 3

  headless-core:
    name: Actual C# core regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          lfs: false
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run canonical core fixtures
        run: |
          mkdir -p integration-evidence
          dotnet run --project tests/headless/ChooGuard.Foundation.Headless.csproj -c Release -- --result=integration-evidence/headless-results.xml --workers=0
      - name: Export temporary local compiler for this development branch
        if: ${{ !cancelled() && github.head_ref == 'feature/astra-foundation-integration-20260915' }}
        run: |
          set -euo pipefail
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          sdk="$(dotnet --list-sdks | awk '$1 ~ /^8[.]/ {print $1}' | sort -V | tail -1)"
          runtime="$(ls "$root/shared/Microsoft.NETCore.App" | grep '^8[.]' | sort -V | tail -1)"
          reference="$(ls "$root/packs/Microsoft.NETCore.App.Ref" | grep '^8[.]' | sort -V | tail -1)"
          out="$RUNNER_TEMP/chooguard-compiler"
          mkdir -p "$out/host/fxr" "$out/shared/Microsoft.NETCore.App" "$out/compiler" "$out/reference" "$out/nunit"
          cp "$root/dotnet" "$out/"
          cp -a "$root/host/fxr/$runtime" "$out/host/fxr/"
          cp -a "$root/shared/Microsoft.NETCore.App/$runtime" "$out/shared/Microsoft.NETCore.App/"
          cp -a "$root/sdk/$sdk/Roslyn/bincore/." "$out/compiler/"
          cp -a "$root/packs/Microsoft.NETCore.App.Ref/$reference/ref/net8.0/." "$out/reference/"
          cp tests/headless/bin/Release/net8.0/nunit*.dll "$out/nunit/"
          find "$root" -maxdepth 1 -type f \( -iname '*license*' -o -iname '*notice*' \) -exec cp {} "$out/" \;
          for package in nunit nunitlite; do
            mkdir -p "$out/nunit/$package-notices"
            find "$HOME/.nuget/packages/$package/3.14.0" -maxdepth 1 -type f \( -iname '*license*' -o -iname '*notice*' \) -exec cp {} "$out/nunit/$package-notices/" \;
          done
          printf 'SDK=%s\nRuntime=%s\nReference=%s\n' "$sdk" "$runtime" "$reference" > "$out/versions.txt"
          tar -czf integration-evidence/compiler.tar.gz -C "$out" .
          sha256sum integration-evidence/compiler.tar.gz > integration-evidence/compiler-sha256.txt
          cp tests/headless/packages.lock.json integration-evidence/packages.lock.json
      - name: Upload regression results and temporary compiler
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-headless-${{ github.run_id }}
          path: integration-evidence/
          if-no-files-found: error
          retention-days: 1

  unity-capability:
    name: Verify Unity execution prerequisites
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check existing Unity CI credentials without disclosure
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_CI_ENABLED: ${{ vars.UNITY_CI_ENABLED }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          licensed = bool(os.environ.get('UNITY_LICENSE'))
          account = bool(os.environ.get('UNITY_EMAIL')) and bool(os.environ.get('UNITY_PASSWORD'))
          enabled = os.environ.get('UNITY_CI_ENABLED') == 'true'
          result = {'schemaVersion': 1, 'unityCiEnabled': enabled,
                    'licenseConfigured': licensed, 'accountConfigured': account,
                    'status': 'CONFIGURED_NOT_EXECUTED' if licensed or account else 'BLOCKED_MISSING_UNITY_LICENSE',
                    'unityTestsExecuted': False}
          Path('unity-capability.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Upload capability result only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-unity-capability-${{ github.run_id }}
          path: unity-capability.json
          if-no-files-found: error
          retention-days: 3
