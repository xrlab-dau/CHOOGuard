name: Container Tool Delivery
on:
  push:
    branches: [chore/astra-toolchain-bootstrap-20260915]
    paths: ['.github/workflows/container-tool-delivery.yml']
permissions:
  contents: read
jobs:
  deliver:
    if: github.repository == 'xrlab-dau/CHOOGuard' && github.ref == 'refs/heads/chore/astra-toolchain-bootstrap-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      UNITY_NO_UPDATE_CHECK: '1'
    steps:
      - name: Fetch checksum-pinned official installation files for the chat container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivery/bin" "$RUNNER_TEMP/delivery/licenses" "$RUNNER_TEMP/mcp"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh -o "$RUNNER_TEMP/installer.sh"
          echo "3e7cc67287e9100ab0950877a968925bd9cfe7a22539ad0e716114523cd4cbc4  $RUNNER_TEMP/installer.sh" | sha256sum --check
          UNITY_CLI_VERSION=1.0.0-beta.9 UNITY_CLI_CHANNEL=beta bash "$RUNNER_TEMP/installer.sh" </dev/null
          echo "8c0d6e2435449c8be7f0e6b2ce6330bfc5f17a98aec4b659c859940455dd0fe5  $HOME/.local/bin/unity" | sha256sum --check
          cp "$HOME/.local/bin/unity" "$RUNNER_TEMP/delivery/bin/unity"
          cp "$RUNNER_TEMP/installer.sh" "$RUNNER_TEMP/delivery/official-installer.sh"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/github/github-mcp-server/releases/download/v1.12.1/github-mcp-server_Linux_x86_64.tar.gz \
            -o "$RUNNER_TEMP/mcp.tar.gz"
          echo "e45c73a26a3c4cd643b40360db06f442de1e73a60d4eaf9e8639204ec3b95d3b  $RUNNER_TEMP/mcp.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp.tar.gz" -C "$RUNNER_TEMP/mcp"
          cp "$RUNNER_TEMP/mcp/github-mcp-server" "$RUNNER_TEMP/delivery/bin/"
          find "$RUNNER_TEMP/mcp" -maxdepth 1 -type f ! -name github-mcp-server -exec cp {} "$RUNNER_TEMP/delivery/licenses/" \;
          cd "$RUNNER_TEMP/delivery"
          sha256sum bin/* official-installer.sh > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > delivery-source-sha.txt
          printf '%s\n' 'Official public CLI installation files only. No login, tokens, licenses, user state, project code, Editor, or acceptance evidence. Transfer for installation in the current chat container; not a persistent service.' > SCOPE.txt
      - name: Transfer short-lived installation package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-official-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 1
