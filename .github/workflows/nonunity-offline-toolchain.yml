name: Non-Unity Offline Toolchain
on:
  push:
    branches: [bugfix/training-state-integrity-20260915]
    paths: [.github/workflows/nonunity-offline-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Fetch and verify the exact official SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline" "$RUNNER_TEMP/dotnet" "$RUNNER_TEMP/test-deps"
          export OUT="$RUNNER_TEMP/offline"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['OUT'])
          meta=json.load(urllib.request.urlopen('https://builds.dotnet.microsoft.com/dotnet/release-metadata/8.0/releases.json',timeout=60))
          sdk=next(s for r in meta['releases'] for s in r.get('sdks',[r['sdk']]) if s['version']=='8.0.423')
          item=next(f for f in sdk['files'] if f['rid']=='linux-x64' and f['name'].endswith('.tar.gz'))
          url='https://builds.dotnet.microsoft.com/dotnet/Sdk/8.0.423/dotnet-sdk-8.0.423-linux-x64.tar.gz'
          urllib.request.urlretrieve(url,out/'sdk.tar.gz')
          actual=hashlib.sha512((out/'sdk.tar.gz').read_bytes()).hexdigest()
          assert actual.lower()==item['hash'].lower(), 'Official SDK hash mismatch'
          (out/'sdk-manifest.json').write_text(json.dumps({'version':'8.0.423','url':url,'sha512':actual,'sha256':hashlib.sha256((out/'sdk.tar.gz').read_bytes()).hexdigest()},indent=2)+'\n')
          PY
          tar xzf "$RUNNER_TEMP/offline/sdk.tar.gz" -C "$RUNNER_TEMP/dotnet"
          "$RUNNER_TEMP/dotnet/dotnet" --version
          printf '%s\n' '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net8.0</TargetFramework><RestorePackagesWithLockFile>true</RestorePackagesWithLockFile></PropertyGroup><ItemGroup><PackageReference Include="NUnit" Version="3.14.0"/><PackageReference Include="NUnit3TestAdapter" Version="4.6.0"/><PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.11.1"/></ItemGroup></Project>' > "$RUNNER_TEMP/test-deps/Tests.csproj"
          "$RUNNER_TEMP/dotnet/dotnet" restore "$RUNNER_TEMP/test-deps/Tests.csproj" --packages "$RUNNER_TEMP/nuget"
          mkdir "$RUNNER_TEMP/offline/feed"
          find "$RUNNER_TEMP/nuget" -name '*.nupkg' -type f -exec cp '{}' "$RUNNER_TEMP/offline/feed/" \;
          cp "$RUNNER_TEMP/test-deps/packages.lock.json" "$RUNNER_TEMP/offline/"
          cd "$RUNNER_TEMP/offline"
          sha256sum feed/*.nupkg > packages.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nonunity-offline-toolchain
          path: ${{ runner.temp }}/offline/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
