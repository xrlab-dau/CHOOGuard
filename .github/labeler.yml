# actions/labeler v7 — path labels for pull requests (existing repository labels only).
"area: unity":
  - changed-files:
      - any-glob-to-any-file: ["Assets/**", "Packages/**", "ProjectSettings/**", "AgentScripts/**"]
"area: ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "prompts/**"]
"area: dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "Packages/manifest.json"
          - "Packages/packages-lock.json"
          - "Assets/packages.config"
          - ".github/requirements/**"
          - "workers/**/requirements*.txt"
"area: reconstruction":
  - changed-files:
      - any-glob-to-any-file: ["art/**", "asset-library/**"]
"area: scenario":
  - changed-files:
      - any-glob-to-any-file: ["content/**", "Assets/ChooGuard/Scenarios/**"]
