name: Feature
about: Plan a bounded product or engineering feature
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective, testable completion conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Unity XR, Reconstruction, Scenario and scoring, Networking, CI and tooling, Documentation]
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Safety, privacy, and performance risks
