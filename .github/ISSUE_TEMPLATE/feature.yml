name: 기능 제안
description: 새 기능 또는 기존 동작 변경 제안
labels: ["enhancement"]
body:
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요
      description: 어떤 플레이·훈련·개발 문제를 푸는지
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 제안
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거
      description: 매뉴얼·도면·영상 등 근거 자료와 출처(발행자·개정일·페이지/타임스탬프)
